/* Тема «Лотос» — одна для всех языков */
:root, html[data-lang="ru"], html[data-lang="kz"], html[data-lang="uz"], html[data-lang="uzl"] {
  --bg1:#241a2e; --bg2:#3a2a48; --panel1:#46335c; --panel2:#2c2039; --card1:#4f3a68; --card2:#35284a;
  --glow:rgba(230,140,190,.20); --gold:#f8d3e3; --gold2:#e9a6c6; --text:#f6eef5; --muted:#cdb8cc;
  --line:rgba(230,140,190,.50); --line-soft:rgba(230,140,190,.22); --hover:rgba(230,140,190,.14);
  --active1:rgba(230,140,190,.38); --active2:rgba(230,140,190,.18); --btn1:#c0649a; --btn2:#9a4b7b; --input:rgba(0,0,0,.22);

* { box-sizing:border-box; }
html, body { margin:0; }
body { font-family:Arial, Helvetica, sans-serif; color:var(--text); min-height:100vh;

  background-attachment:fixed; transition:background .4s, color .4s; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { font-family:"PT Serif", Georgia, serif; font-weight:500; color:var(--gold); margin:0 0 .5em; line-height:1.2; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--gold); }
.hidden { display:none !important; }
#app { min-height:100vh; display:flex; flex-direction:column; }

/* ===== Каркас ===== */
.platform { flex:1; display:flex; padding:8px; }
.sidebar { width:270px; flex-shrink:0; padding:24px 14px 18px; border:1px solid var(--line); border-radius:18px 0 0 18px;
  background: radial-gradient(circle at 50% 8%, var(--glow), transparent 30%), linear-gradient(180deg, var(--panel1) 0%, var(--panel2) 100%);
  display:flex; flex-direction:column; transition:background .4s; }
.side-head { display:block; }
.logo { text-align:center; margin-bottom:24px; }
.logo-symbol { width:88px; height:88px; margin:0 auto 12px; border-radius:50%; border:2px solid var(--gold2);

.logo-title { font-family:"PT Serif", Georgia, serif; font-size:22px; color:var(--gold); letter-spacing:2px; text-transform:uppercase; }
.logo-subtitle { margin-top:6px; font-size:15px; color:var(--gold2); }
.nav { display:flex; flex-direction:column; gap:4px; }
.nav-sep { height:1px; background:var(--line-soft); margin:8px 6px; }
.nav-item { width:100%; min-height:44px; padding:10px 12px; border-radius:12px; border:1px solid transparent; background:transparent;
  color:var(--text); font-size:15px; text-align:left; cursor:pointer; display:flex; align-items:center; gap:4px; transition:background .25s, border-color .25s; }
.nav-item:hover { background:var(--hover); border-color:var(--line-soft); }
.nav-item.active { background:linear-gradient(90deg, var(--active1), var(--active2)); border-color:var(--gold2); color:var(--gold); }
.nav-icon { display:inline-flex; width:30px; min-width:30px; justify-content:center; font-size:18px; }
.nav .logout { margin-top:14px; color:var(--gold); }
.burger { display:none; }
.main { flex:1; min-width:0; padding:26px 28px 26px; border:1px solid var(--line); border-left:none; border-radius:0 18px 18px 0;
  background: radial-gradient(circle at 55% 4%, var(--glow), transparent 30%), linear-gradient(160deg, var(--panel2), var(--bg2));
  display:flex; flex-direction:column; transition:background .4s; }
.topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; }
.topbar h1 { margin:0; font-size:32px; }
.account { display:flex; align-items:center; gap:10px; flex-shrink:0; font-size:13px; color:var(--muted); }
.account .mail { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#main { flex:1; }

/* ===== Маленький переключатель языка ===== */
.lang { position:relative; }
.lang-btn { border:1px solid var(--line-soft); background:var(--input); color:var(--gold); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; letter-spacing:.5px; }
.lang-btn:hover { border-color:var(--gold2); }
.lang-menu { position:absolute; right:0; top:calc(100% + 6px); min-width:130px; border:1px solid var(--line); border-radius:12px; padding:4px; z-index:60;

.lang-menu button { display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--text); padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
.lang-menu button:hover { background:var(--hover); }
.lang-menu button.on { color:var(--gold); }
.auth-lang { position:fixed; top:14px; right:16px; z-index:50; }

/* ===== Общие ===== */
.card { border:1px solid var(--line); border-radius:18px; padding:20px;

.muted { color:var(--muted); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn { border:1px solid var(--gold2); background:linear-gradient(90deg, var(--btn1), var(--btn2)); color:var(--gold); padding:11px 18px; border-radius:11px; cursor:pointer; font-size:15px; }
.btn:hover { filter:brightness(1.12); }
.btn.ghost { background:transparent; color:var(--text); border-color:var(--line-soft); }
.btn.small { padding:7px 11px; font-size:13px; border-radius:9px; }
.btn.danger { background:linear-gradient(90deg,#9b3434,#7a2626); border-color:#d98a8a; color:#ffe2e2; }
input, select, textarea { width:100%; border:1px solid var(--line-soft); background:var(--input); color:var(--text); border-radius:10px; padding:11px 13px; outline:none; }
select option { color:#111; }
input:focus, select:focus, textarea:focus { border-color:var(--gold2); }
input::placeholder, textarea::placeholder { color:var(--muted); opacity:.75; }
textarea { min-height:90px; resize:vertical; }
label.f { display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; }
.grid3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:0 12px; }

.empty { text-align:center; padding:36px 16px; color:var(--muted); }
.badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line-soft); }
.badge.ok { background:rgba(80,190,120,.18); color:#a8f0bf; border-color:rgba(120,220,150,.5); }
table.list { width:100%; border-collapse:collapse; font-size:14px; }
table.list th, table.list td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
table.list th { color:var(--gold2); font-weight:normal; font-size:13px; }
.table-wrap { overflow-x:auto; }
.code { font-family:ui-monospace, Menlo, monospace; font-size:24px; letter-spacing:3px; color:var(--gold); border:1px solid var(--line); background:var(--input); padding:8px 16px; border-radius:10px; display:inline-block; }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#111; color:#fff; border:1px solid var(--gold2); padding:10px 16px; border-radius:12px; z-index:200; font-size:14px; }
footer.foot { text-align:center; padding:16px; font-size:14px; color:var(--muted); }
footer.foot b { color:var(--gold); font-family:"PT Serif", Georgia, serif; font-weight:normal; font-size:16px; }

/* ===== Разделы и материалы ===== */

.crumbs button { background:none; border:0; color:var(--gold2); cursor:pointer; padding:0; font-size:13px; }
.intro { line-height:1.6; margin-bottom:18px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-bottom:22px; }
.tile { text-align:left; border:1px solid var(--line-soft); border-radius:16px; padding:16px; cursor:pointer; color:var(--text);

.tile:hover { border-color:var(--gold2); transform:translateY(-2px); }
.tile .ti { font-size:26px; width:40px; text-align:center; flex-shrink:0; }
.tile .tt { font-size:15px; line-height:1.3; }
.tile .tc { font-size:12px; color:var(--muted); margin-top:3px; }

.mat .mt { flex:1; min-width:0; }

.article { max-width:860px; line-height:1.7; font-size:16px; }
.article img.cover { max-width:100%; border-radius:14px; margin:6px 0 14px; display:block; }
.article h3 { font-size:21px; margin:18px 0 8px; }
.article ul { padding-left:22px; }
.video { position:relative; padding-top:56.25%; border-radius:14px; overflow:hidden; margin:8px 0 16px; border:1px solid var(--line-soft); }
.video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.fav { background:none; border:1px solid var(--line-soft); color:var(--gold); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:14px; }

.auth-card .logo { margin-bottom:16px; }
.auth-card h2 { margin:6px 0 16px; }
.auth-card input { margin:6px 0; padding:14px; font-size:16px; }
.auth-card .btn { width:100%; padding:14px; font-size:16px; margin-top:10px; }
.auth-card .btn.outline { background:transparent; }
.auth-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }

.msg { margin-top:12px; font-size:14px; min-height:1em; }
.msg.err { color:#ffadad; } .msg.ok { color:#a8f0bf; }
.linkbtn { background:none; border:0; color:var(--muted); cursor:pointer; padding:8px 0; font-size:15px; }
.divider { color:var(--muted); margin:8px 0 2px; font-size:14px; }

/* ===== Телефон ===== */

  .sidebar { width:100%; border-radius:16px 16px 0 0; padding:12px 14px; }

  .logo-symbol { width:50px; height:50px; font-size:24px; margin:0; }

  .nav { display:none; margin-top:12px; }

  .topbar { flex-direction:column-reverse; gap:8px; }
  .account { align-self:flex-end; }
  .account .mail { max-width:170px; }

  .modal-bg { padding:8px; align-items:flex-end; } .modal { padding:18px 14px; max-height:90vh; }
}

</style>

const LANG_SHORT = { ru:"РУС", kz:"ҚАЗ", uz:"ЎЗБ" }, LANG_FULL = { kz:"Қазақша", ru:"Русский", uz:"Ўзбекча" };

/* ========= Состояние ========= */
const LS_LANG = P + "_lang", LS_CODE = P + "_pending_code";
const S = {
  lang: (() => { try { const l = localStorage.getItem(LS_LANG); return ["ru","kz","uz"].includes(l) ? l : "ru"; } catch(e){ return "ru"; } })(),
  user:null, member:null, isAdmin:false, hasAccess:false,
  secs:[], byId:{}, kids:{}, favs:new Set(), view:{ t:"home" }
};
const t = k => (I18N[S.lang] && I18N[S.lang][k]) || I18N.ru[k] || k;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const L = (o, base) => (o && (o[base + "_" + S.lang] || o[base + "_ru"] || o[base + "_kz"])) || "";
function toast(m){ const el = $("toast"); el.textContent = m; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hidden"), 2200); }
let rerender = () => {};

/* ========= Язык: маленький значок справа вверху ========= */
// Узбекский виден только тем, кому администратор открыл его в «Доступе»
function canUz(){ return !!(S.user && (S.isAdmin || (S.member && S.member.uz_access))); }
function applyLang(){ document.documentElement.dataset.lang = S.lang; document.documentElement.lang = ({ kz:"kk", uz:"uz-Cyrl" })[S.lang] || "ru"; document.title = CONFIG.name[S.lang]; }
function setLang(l){
  if (l === "uz" && !canUz()) l = "ru";
  S.lang = l; try { localStorage.setItem(LS_LANG, l); } catch(e){}
  applyLang(); closeLang(); rerender();
}
function langDrop(){
  const opts = ["kz","ru"].concat(canUz() ? ["uz"] : []);
  return `<div class="lang" id="langBox"><button class="lang-btn" onclick="event.stopPropagation();$('langMenu').classList.toggle('hidden')">🌐 ${LANG_SHORT[S.lang]} ▾</button>
    <div class="lang-menu hidden" id="langMenu">${opts.map(l => `<button class="${S.lang===l?'on':''}" onclick="setLang('${l}')">${LANG_FULL[l]}</button>`).join("")}</div></div>`;
}
function closeLang(){ const m = $("langMenu"); if (m) m.classList.add("hidden"); }
document.addEventListener("click", closeLang);

function logoHtml(){ return `<div class="logo"><div class="logo-symbol">${CONFIG.logoSymbol}</div><div><div class="logo-title">${esc(CONFIG.logoTitle[S.lang])}</div><div class="logo-subtitle">${esc(CONFIG.logoSubtitle[S.lang])}</div></div></div>`; }
function footerHtml(){ const site = CONFIG.site ? ` · <a href="https://${esc(CONFIG.site)}" target="_blank" rel="noopener">${esc(CONFIG.site)}</a>` : "";
  return `<footer class="foot"><b>${esc(CONFIG.name[S.lang])}</b>${site}<br>© ${new Date().getFullYear()} · ${t("footer")}</footer>`; }

/* ========= Вход и регистрация ========= */
let authView = "login";
function renderAuth(){
  if (S.lang === "uz") { S.lang = "ru"; applyLang(); }
  rerender = renderAuth;
  let inner = "", wide = false;
  if (authView === "login") inner = `<h2>${t("loginTitle")}</h2>
    <input id="lEmail" type="email" placeholder="${t("email")}" autocomplete="email">
    <input id="lPass" type="password" placeholder="${t("password")}" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">${t("enter")}</button>
    <button class="linkbtn" onclick="authView='reset';renderAuth()">${t("forgot")}</button>
    <div class="divider">${t("or")}</div>
    <button class="btn outline" onclick="authView='register';renderAuth()">${t("registerBtn")}</button>
    <div class="msg" id="aMsg"></div>`;
  else if (authView === "register") { wide = true; inner = `<h2>${t("register")}</h2>
    <div class="auth-grid"><input id="rLast" placeholder="${t("lastName")}"><input id="rFirst" placeholder="${t("firstName")}">
    <input id="rPhone" type="tel" placeholder="${t("phone")}: +77001234567" oninput="this.value=this.value.replace(/[^\\d+]/g,'')"><input id="rEmail" type="email" placeholder="${t("email")}" autocomplete="email">
    <input id="rPass" type="password" placeholder="${t("password")}" autocomplete="new-password"><input id="rPass2" type="password" placeholder="${t("password2")}" autocomplete="new-password"></div>
    <input id="rCode" style="text-transform:uppercase" maxlength="8" placeholder="${t("teacherCodeOpt")}">
    <button class="btn" onclick="doRegister()">${t("createAcc")}</button><div class="msg" id="aMsg"></div>
    <button class="linkbtn" onclick="authView='login';renderAuth()">${t("haveAccount")}</button>`; }
  else inner = `<h2>${t("resetTitle")}</h2><input id="pEmail" type="email" placeholder="${t("email")}">
    <button class="btn" onclick="doReset()">${t("sendLink")}</button><div class="msg" id="aMsg"></div>
    <button class="linkbtn" onclick="authView='login';renderAuth()">${t("haveAccount")}</button>`;
  $("app").innerHTML = `<div class="auth-lang">${langDrop()}</div><div class="auth"><div class="auth-card ${wide ? "wide" : ""}">
    <div class="logo" style="display:block"><div class="logo-symbol">${CONFIG.logoSymbol}</div><div class="logo-title">${esc(CONFIG.logoTitle[S.lang])}</div><div class="logo-subtitle">${esc(CONFIG.logoSubtitle[S.lang])}</div></div>
    ${inner}</div></div>${footerHtml()}`;
}
function aMsg(text, ok){ const m = $("aMsg"); if (m){ m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); } }
async function doLogin(){
  const email = $("lEmail").value.trim().toLowerCase(), password = $("lPass").value;
  if (!email || !password) return aMsg(t("fillAll"));
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return aMsg(t("wrongLogin"));
  await boot();
}
async function doRegister(){
  const last = $("rLast").value.trim(), first = $("rFirst").value.trim(), phone = $("rPhone").value.trim();
  const email = $("rEmail").value.trim().toLowerCase(), p1 = $("rPass").value, p2 = $("rPass2").value, code = $("rCode").value.trim().toUpperCase();
  if (!last || !first || !phone || !email || !p1) return aMsg(t("fillAll"));
  if (!/^\+\d{8,15}$/.test(phone)) return aMsg(t("badPhone"));
  if (p1.length < 6) return aMsg(t("pwShort"));
  if (p1 !== p2) return aMsg(t("pwMismatch"));
  try { if (code) localStorage.setItem(LS_CODE, code); } catch(e){}
  // Регистрация без письма-подтверждения; доступ к разделам открывает только администратор
  const { data, error } = await sb.functions.invoke("platform-signup", { body:{ platform:P, email, password:p1, first_name:first, last_name:last, phone } });
  const st = error ? "error" : (data && data.status);
  if (st === "ok" || st === "exists") {
    const r = await sb.auth.signInWithPassword({ email, password:p1 });
    if (r.error) return aMsg(st === "exists" ? t("emailExists") : t("regError"));
    await sb.rpc(P + "_self_register");
    aMsg(t("regOk"), true); return boot();
  }
  if (st === "bad_email") return aMsg(t("badEmail"));
  if (st === "bad_password") return aMsg(t("pwShort"));
  return aMsg(t("regError"));
}
async function doReset(){
  const email = $("pEmail").value.trim().toLowerCase(); if (!email) return aMsg(t("fillAll"));
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) return aMsg(error.message); aMsg(t("linkSent"), true);
}
async function doLogout(){ await sb.auth.signOut(); S.user = null; S.member = null; S.isAdmin = false; authView = "login"; location.hash = ""; renderAuth(); }

/* ========= Загрузка ========= */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return renderAuth();
  S.user = session.user;
  let code = null; try { code = localStorage.getItem(LS_CODE); } catch(e){}
  const j = await sb.rpc(P + "_join", { p_code: code || null });
  if (j.data === "not_member") { await sb.auth.signOut(); S.user = null; authView = "login"; renderAuth(); aMsg(t("notMember")); return; }
  if (code) { try { localStorage.removeItem(LS_CODE); } catch(e){} }
  const [mem, adm, acc] = await Promise.all([
    sb.from(P + "_members").select("*").eq("profile_id", S.user.id).maybeSingle(),
    sb.rpc(P + "_is_admin"), sb.rpc(P + "_has_access") ]);
  S.member = mem.data || { role:"student" }; S.isAdmin = !!adm.data; S.hasAccess = !!acc.data;
  if (S.lang === "uz" && !canUz()) { S.lang = "ru"; try { localStorage.setItem(LS_LANG, "ru"); } catch(e){} }
  applyLang();
  await loadSections();
  if (S.hasAccess) { const f = await sb.from(P + "_favorites").select("material_id").eq("user_id", S.user.id); S.favs = new Set((f.data || []).map(x => x.material_id)); }
  route();
}
async function loadSections(){
  const { data } = await sb.from(P + "_sections").select("*").order("sort_order").order("created_at");
  S.secs = data || []; S.byId = {}; S.kids = {};
  S.secs.forEach(s => { S.byId[s.id] = s; const k = s.parent_id || "root"; (S.kids[k] = S.kids[k] || []).push(s); });
}
const kids = id => (S.kids[id || "root"] || []).filter(s => s.is_active || S.isAdmin);
function trail(id){ const a = []; let s = S.byId[id]; while (s) { a.unshift(s); s = S.byId[s.parent_id]; } return a; }

/* ========= Навигация (через адрес, чтобы работала кнопка «Назад») ========= */
function go(h){ if (location.hash === "#" + h) route(); else location.hash = h; }
window.addEventListener("hashchange", () => { if (S.user) route(); });
function route(){
  const h = location.hash.replace(/^#/, "").split("/");
  if (h[0] === "s" && S.byId[h[1]]) S.view = { t:"sec", id:h[1] };
  else if (h[0] === "m" && h[1]) S.view = { t:"mat", id:h[1] };
  else if (h[0] === "fav") S.view = { t:"fav" };
  else if (h[0] === "access") S.view = { t:"access" };
  else S.view = { t:"home" };
  renderApp(); window.scrollTo(0, 0);
}
function canSeeAccess(){ return S.isAdmin || S.member?.role === "teacher"; }
function activeRoot(){ if (S.view.t === "sec") return trail(S.view.id)[0]?.id; if (S.view.t === "mat") return S.view.root; return null; }
function renderApp(){
  rerender = renderApp;
  const root = activeRoot(), v = S.view.t;
  const item = (on, icon, label, h) => `<button class="nav-item ${on?'active':''}" onclick="go('${h}');$('sidebar').classList.remove('open')"><span class="nav-icon">${icon}</span> ${esc(label)}</button>`;
  $("app").innerHTML = `<div class="platform">
    <aside class="sidebar" id="sidebar"><div class="side-head">${logoHtml()}<button class="burger" onclick="$('sidebar').classList.toggle('open')">☰</button></div>
      <div class="nav">${item(v==="home", "🏠", t("home"), "")}
        ${kids(null).map(s => item(root===s.id, esc(s.icon || "•"), L(s,"title"), "s/" + s.id)).join("")}
        <div class="nav-sep"></div>${item(v==="fav", "⭐", t("favorites"), "fav")}
        ${canSeeAccess() ? item(v==="access", "🔑", t("access"), "access") : ""}
        <button class="nav-item logout" onclick="doLogout()"><span class="nav-icon">🚪</span> ${t("logout")}</button></div></aside>
    <section class="main"><div class="topbar"><h1 id="pageTitle"></h1><div class="account"><span class="mail">${esc(S.user.email)}</span>${langDrop()}</div></div>
      <div id="main"><div class="empty">${t("loading")}</div></div>${footerHtml()}</section></div>`;
  renderMain();
}
function setTitle(x){ const h = $("pageTitle"); if (h) h.textContent = x; }
function noAccessHtml(){ return `<div class="card empty"><div style="font-size:46px">🔒</div><h2>${t("noAccessTitle")}</h2><p>${t("noAccessText")}</p></div>`; }
function renderMain(){
  const m = $("main"); if (!m) return;
  const v = S.view;
  if (v.t === "access") { setTitle(t("access")); return renderAccess(m); }
  if (v.t === "home") return renderHome(m);
  if (!S.hasAccess) { setTitle(v.t === "sec" ? L(S.byId[v.id],"title") : t(v.t === "fav" ? "favorites" : "home")); return m.innerHTML = noAccessHtml(); }
  if (v.t === "sec") return renderSection(m, v.id);
  if (v.t === "mat") return renderMaterial(m, v.id);
  if (v.t === "fav") return renderFav(m);
}

/* ========= Главная ========= */
function tilesHtml(list){
  return `<div class="tiles">${list.map(s => { const n = kids(s.id).length;
    return `<button class="tile" onclick="go('s/${s.id}')"><span class="ti">${esc(s.icon || "📁")}</span><span><div class="tt">${esc(L(s,"title"))}${s.is_active ? "" : `<span class="draft">${t("draft")}</span>`}</div>${n ? `<div class="tc">${n} · ${t("folders").toLowerCase()}</div>` : ""}</span></button>`; }).join("")}</div>`;
}
function renderHome(m){
  setTitle(t("home"));
  m.innerHTML = `<div class="card" style="margin-bottom:18px"><h2>${t("welcome")}</h2><p class="intro" style="margin:0">${esc(CONFIG.welcome[S.lang] || CONFIG.welcome.ru)}</p></div>
    ${S.hasAccess ? "" : noAccessHtml() + "<br>"}
    ${S.isAdmin ? `<div class="admin-bar"><button class="btn small" onclick="secForm(null, null)">${t("addFolder")}</button></div>` : ""}
    ${tilesHtml(kids(null))}`;
}

/* ========= Раздел ========= */
function crumbsHtml(id, extra){
  const tr = trail(id);
  return `<div class="crumbs"><button onclick="go('')">${t("home")}</button>${tr.map((s,i) => ` › ${i === tr.length-1 && !extra ? `<span>${esc(L(s,"title"))}</span>` : `<button onclick="go('s/${s.id}')">${esc(L(s,"title"))}</button>`}`).join("")}${extra ? " › <span>" + esc(extra) + "</span>" : ""}</div>`;
}
async function renderSection(m, id){
  const s = S.byId[id]; setTitle(L(s,"title"));
  const sub = kids(id);
  m.innerHTML = `${crumbsHtml(id)}
    ${S.isAdmin ? `<div class="admin-bar"><button class="btn small" onclick="secForm(null,'${id}')">${t("addFolder")}</button><button class="btn small" onclick="matForm(null,'${id}')">${t("addMat")}</button>
      <button class="btn small ghost" onclick="secForm('${id}')">${t("editSec")}</button><button class="btn small ghost" onclick="delSec('${id}')">${t("delSec")}</button></div>` : ""}
    ${L(s,"intro") ? `<div class="intro">${esc(L(s,"intro"))}</div>` : ""}
    ${sub.length ? tilesHtml(sub) : ""}
    <div id="matBox"><div class="empty">${t("loading")}</div></div>`;
  const { data } = await sb.from(P + "_materials").select("id,title_ru,title_kz,title_uz,image_url,video_url,is_published,sort_order").eq("section_id", id).order("sort_order").order("created_at");
  const box = $("matBox"); if (!box) return;
  const list = data || [];
  box.innerHTML = list.length ? (sub.length ? `<h3 class="sub">${t("materials")}</h3>` : "") + matList(list)
    : (sub.length ? "" : `<div class="card empty">${t("emptySec")}</div>`);
}
function matList(list){
  return `<div class="mats">${list.map(x => `<div class="mat" onclick="go('m/${x.id}')">${x.image_url ? `<img src="${esc(x.image_url)}" alt="" loading="lazy">` : `<span class="mi">${x.video_url ? "🎬" : "📄"}</span>`}
    <div class="mt"><b>${esc(L(x,"title"))}</b>${x.is_published === false ? `<span class="draft">${t("draft")}</span>` : ""}</div>${S.favs.has(x.id) ? "⭐" : ""}</div>`).join("")}</div>`;
}

/* ========= Материал ========= */
function videoEmbed(url){
  if (!url) return "";
  let u = url.trim(), m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) u = "https://www.youtube.com/embed/" + m[1];
  else if ((m = u.match(/vimeo\.com\/(\d+)/))) u = "https://player.vimeo.com/video/" + m[1];
  else if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) u = "https://drive.google.com/file/d/" + m[1] + "/preview";
  else return `<p><a href="${esc(u)}" target="_blank" rel="noopener">▶ ${esc(u)}</a></p>`;
  return `<div class="video"><iframe src="${esc(u)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
}
function textHtml(src){
  if (!src) return "";
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  return src.replace(/\r/g, "").split(/\n{2,}/).map(block => {
    const lines = block.split("\n");
    if (lines.every(l => /^\s*-\s+/.test(l))) return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*-\s+/, "")) + "</li>").join("") + "</ul>";
    return lines.map(l => /^##\s+/.test(l) ? "<h3>" + inline(l.replace(/^##\s+/, "")) + "</h3>" : null).every(x => x)
      ? lines.map(l => "<h3>" + inline(l.replace(/^##\s+/, "")) + "</h3>").join("")
      : "<p>" + lines.map(l => /^##\s+/.test(l) ? "</p><h3>" + inline(l.replace(/^##\s+/, "")) + "</h3><p>" : inline(l)).join("<br>") + "</p>";
  }).join("").replace(/<p><\/p>/g, "").replace(/<p><br>/g, "<p>");
}
async function renderMaterial(m, id){
  const { data:x } = await sb.from(P + "_materials").select("*").eq("id", id).maybeSingle();
  if (!x) { setTitle(""); return m.innerHTML = `<div class="card empty">${t("error")}</div>`; }
  S.view.root = trail(x.section_id)[0]?.id;
  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.getAttribute("onclick")?.includes("'s/" + S.view.root + "'")));
  setTitle(L(x,"title"));
  m.innerHTML = `${crumbsHtml(x.section_id, L(x,"title"))}
    ${S.isAdmin ? `<div class="admin-bar"><button class="btn small" onclick="matForm('${x.id}')">${t("edit")}</button><button class="btn small ghost" onclick="delMat('${x.id}','${x.section_id}')">🗑 ${t("del")}</button></div>` : ""}
    <div class="article">
      <div class="row" style="margin-bottom:12px"><button class="fav ${S.favs.has(x.id)?'on':''}" onclick="toggleFav('${x.id}')">${S.favs.has(x.id) ? t("inFav") : t("toFav")}</button>${x.is_published ? "" : `<span class="draft">${t("draft")}</span>`}</div>
      ${x.image_url ? `<img class="cover" src="${esc(x.image_url)}" alt="">` : ""}
      ${videoEmbed(x.video_url)}
      ${textHtml(L(x,"body"))}
      ${x.source ? `<p class="muted" style="margin-top:22px">📚 ${t("srcLabel")}: ${esc(x.source)}</p>` : ""}
    </div>`;
}
async function toggleFav(id){
  if (S.favs.has(id)) { await sb.from(P + "_favorites").delete().eq("user_id", S.user.id).eq("material_id", id); S.favs.delete(id); }
  else { const { error } = await sb.from(P + "_favorites").insert({ user_id:S.user.id, material_id:id }); if (error) return toast(t("error")); S.favs.add(id); }
  renderMain();
}
async function renderFav(m){
  setTitle(t("favorites"));
  if (!S.favs.size) return m.innerHTML = `<div class="card empty">${t("noFav")}</div>`;
  const { data } = await sb.from(P + "_materials").select("id,title_ru,title_kz,title_uz,image_url,video_url,is_published").in("id", [...S.favs]);
  m.innerHTML = matList(data || []);
}

/* ========= Редактирование (только администратор) ========= */
function modal(html){ $("modalRoot").innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ $("modalRoot").innerHTML = ""; }
const val = (o, k) => esc(o && o[k] != null ? o[k] : "");
function secForm(id, parent){
  const s = id ? S.byId[id] : { parent_id:parent, icon:"", sort_order:((kids(parent).slice(-1)[0]?.sort_order) || 0) + 10, is_active:true };
  modal(`<h2>${id ? t("editSec") : t("newFolder")}</h2>
    <div class="grid3"><div><label class="f">${t("titleRu")}</label><input id="sTr" value="${val(s,"title_ru")}"></div><div><label class="f">${t("titleKz")}</label><input id="sTk" value="${val(s,"title_kz")}"></div><div><label class="f">${t("titleUz")}</label><input id="sTu" value="${val(s,"title_uz")}"></div></div>
    <div class="grid3"><div><label class="f">${t("introRu")}</label><textarea id="sIr">${val(s,"intro_ru")}</textarea></div><div><label class="f">${t("introKz")}</label><textarea id="sIk">${val(s,"intro_kz")}</textarea></div><div><label class="f">${t("introUz")}</label><textarea id="sIu">${val(s,"intro_uz")}</textarea></div></div>
    <div class="grid3"><div><label class="f">${t("icon")}</label><input id="sIc" value="${val(s,"icon")}" maxlength="8"></div><div><label class="f">${t("order")}</label><input id="sSo" type="number" value="${val(s,"sort_order")}"></div>
      <div><label class="f">&nbsp;</label><label class="row" style="cursor:pointer"><input id="sAc" type="checkbox" style="width:auto" ${s.is_active?"checked":""}> ${t("published")}</label></div></div>
    <div class="row" style="margin-top:18px"><button class="btn" onclick="saveSec(${id ? `'${id}'` : "null"}, ${s.parent_id ? `'${s.parent_id}'` : "null"})">${t("save")}</button><button class="btn ghost" onclick="closeModal()">${t("cancel")}</button></div>`);
}
async function saveSec(id, parent){
  const row = { title_ru:$("sTr").value.trim(), title_kz:$("sTk").value.trim(), title_uz:$("sTu").value.trim(), intro_ru:$("sIr").value.trim() || null, intro_kz:$("sIk").value.trim() || null, intro_uz:$("sIu").value.trim() || null,
    icon:$("sIc").value.trim() || null, sort_order:Number($("sSo").value) || 0, is_active:$("sAc").checked };
  if (!row.title_ru && !row.title_kz) return toast(t("needTitle"));
  const q = id ? sb.from(P + "_sections").update(row).eq("id", id) : sb.from(P + "_sections").insert({ ...row, parent_id:parent });
  const { error } = await q; if (error) return toast(t("error") + ": " + error.message);
  closeModal(); toast(t("saved")); await loadSections(); route();
}
async function delSec(id){
  if (!confirm(t("delSecAsk") + "\n" + L(S.byId[id],"title"))) return;
  const parent = S.byId[id].parent_id;
  const { error } = await sb.from(P + "_sections").delete().eq("id", id); if (error) return toast(t("error"));
  await loadSections(); go(parent ? "s/" + parent : "");
}
async function matForm(id, section){
  let x = { section_id:section, is_published:true, sort_order:0 };
  if (id) { const { data } = await sb.from(P + "_materials").select("*").eq("id", id).maybeSingle(); if (data) x = data; }
  const opts = S.secs.map(s => ({ s, path: trail(s.id).map(z => L(z,"title")).join(" › ") })).sort((a,b) => a.path.localeCompare(b.path))
    .map(o => `<option value="${o.s.id}" ${o.s.id===x.section_id?"selected":""}>${esc(o.path)}</option>`).join("");
  modal(`<h2>${id ? t("edit") : t("newMat")}</h2>
    <label class="f">${t("folders")}</label><select id="mSec">${opts}</select>
    <div class="grid3"><div><label class="f">${t("titleRu")}</label><input id="mTr" value="${val(x,"title_ru")}"></div><div><label class="f">${t("titleKz")}</label><input id="mTk" value="${val(x,"title_kz")}"></div><div><label class="f">${t("titleUz")}</label><input id="mTu" value="${val(x,"title_uz")}"></div></div>
    <div class="grid3"><div><label class="f">${t("bodyRu")}</label><textarea id="mBr" style="min-height:240px">${val(x,"body_ru")}</textarea></div><div><label class="f">${t("bodyKz")}</label><textarea id="mBk" style="min-height:240px">${val(x,"body_kz")}</textarea></div><div><label class="f">${t("bodyUz")}</label><textarea id="mBu" style="min-height:240px">${val(x,"body_uz")}</textarea></div></div>
    <p class="muted" style="font-size:13px">${t("textHint")}</p>
    <label class="f">${t("video")}</label><input id="mVd" value="${val(x,"video_url")}">
    <label class="f">${t("image")}</label><input id="mIm" value="${val(x,"image_url")}">
    <div class="grid3"><div style="grid-column:span 2"><label class="f">${t("source")}</label><input id="mSrc" value="${val(x,"source")}"></div><div><label class="f">${t("order")}</label><input id="mSo" type="number" value="${val(x,"sort_order")}"></div></div>
    <label class="row" style="margin-top:14px;cursor:pointer"><input id="mPub" type="checkbox" style="width:auto" ${x.is_published?"checked":""}> ${t("published")}</label>
    <div class="row" style="margin-top:18px"><button class="btn" onclick="saveMat(${id ? `'${id}'` : "null"})">${t("save")}</button><button class="btn ghost" onclick="closeModal()">${t("cancel")}</button></div>`);
}
async function saveMat(id){
  const row = { section_id:$("mSec").value, title_ru:$("mTr").value.trim(), title_kz:$("mTk").value.trim(), title_uz:$("mTu").value.trim(),
    body_ru:$("mBr").value || null, body_kz:$("mBk").value || null, body_uz:$("mBu").value || null, video_url:$("mVd").value.trim() || null, image_url:$("mIm").value.trim() || null,
    source:$("mSrc").value.trim() || null, sort_order:Number($("mSo").value) || 0, is_published:$("mPub").checked, updated_at:new Date().toISOString() };
  if (!row.title_ru && !row.title_kz) return toast(t("needTitle"));
  let rid = id;
  if (id) { const { error } = await sb.from(P + "_materials").update(row).eq("id", id); if (error) return toast(t("error") + ": " + error.message); }
  else { const { data, error } = await sb.from(P + "_materials").insert({ ...row, created_by:S.user.id }).select("id").single(); if (error) return toast(t("error") + ": " + error.message); rid = data.id; }
  closeModal(); toast(t("saved")); go("m/" + rid);
}
async function delMat(id, sec){
  if (!confirm(t("delMatAsk"))) return;
  const { error } = await sb.from(P + "_materials").delete().eq("id", id); if (error) return toast(t("error"));
  go("s/" + sec);
}

/* ========= Доступ ========= */
async function renderAccess(m){
  if (!canSeeAccess()) return m.innerHTML = noAccessHtml();
  const codeCard = (!S.isAdmin && S.member.role === "teacher") ? `<div class="card" style="max-width:640px;margin-bottom:16px"><p><b>${t("yourCode")}:</b></p><div class="code">${S.user.id.slice(0,8).toUpperCase()}</div><p class="muted">${t("codeHint")}</p></div>` : "";
  m.innerHTML = codeCard + `<div id="usersBox"></div>`;
  await renderUsers($("usersBox"), S.isAdmin);
}
async function renderUsers(m, admin){
  m.innerHTML = `<div class="empty">${t("loading")}</div>`;
  const { data, error } = await sb.rpc(P + "_list_users");
  if (error) return m.innerHTML = `<div class="empty">${t("error")}: ${esc(error.message)}</div>`;
  if (!data.length) return m.innerHTML = `<div class="card empty">${t("noStudents")}</div>`;
  window._users = Object.fromEntries(data.map(u => [u.id, u]));
  const grey = 'style="color:var(--muted);opacity:.75"';
  const status = u => u.has_access
    ? `<span class="badge ok">${u.access_unlimited ? t("openForever") : t("openUntil") + " " + new Date(new Date(u.access_until).getTime()-1).toLocaleDateString("ru-RU")}</span>`
    : `<span ${grey}>${t("pending")}</span>`;
  m.innerHTML = `<div class="card table-wrap"><table class="list"><tr><th>${t("name")}</th><th>${t("phone")} / ${t("email")}</th><th>${t("mail")}</th>${admin ? `<th>${t("role")}</th>` : ""}<th>${t("access")}</th><th>${t("term")}</th><th></th>${admin ? `<th>${t("uzLang")}</th><th></th>` : ""}</tr>
    ${data.map(u => `<tr ${u.has_access ? "" : grey}><td><b>${esc(u.last_name)} ${esc(u.first_name)}</b></td><td>${esc(u.phone||"")}<br><span class="muted">${esc(u.email||"")}</span></td>
      <td>${u.email_confirmed ? t("mailOk") : `<span>${t("mailNo")}</span>${admin ? `<br><button class="btn small ghost" onclick="confirmMail('${u.id}')">${t("confirmMail")}</button>` : ""}`}</td>
      ${admin ? `<td><select onchange="setRole('${u.id}',this.value)" style="min-width:110px"><option value="student" ${u.role==='student'?'selected':''}>${t("roleStudent")}</option><option value="teacher" ${u.role==='teacher'?'selected':''}>${t("roleTeacher")}</option></select></td>` : ""}
      <td>${status(u)}</td>
      <td><select id="term_${u.id}" style="min-width:120px"><option value="0">${t("forever")}</option><option value="1">${t("m1")}</option><option value="3">${t("m3")}</option><option value="6">${t("m6")}</option><option value="12">${t("y1")}</option></select></td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn small" onclick="openAccess('${u.id}')">${t("openAcc")}</button>${u.has_access ? `<button class="btn small danger" onclick="closeAccess('${u.id}')">${t("closeAcc2")}</button>` : ""}</div></td>
      ${admin ? `<td>${u.uz_access ? `<span class="badge ok">${t("uzOn")}</span><br><button class="btn small ghost" onclick="setUz('${u.id}',false)">${t("closeAcc")}</button>` : `<span>${t("uzOff")}</span><br><button class="btn small" onclick="setUz('${u.id}',true)">${t("give")}</button>`}</td>
      <td><button class="btn small ghost" onclick="removeUser('${u.id}')">${t("del")}</button></td>` : ""}</tr>`).join("")}</table></div>`;
}
const okToast = d => { toast(d === "ok" ? t("saved") : t("error")); renderMain(); };
async function openAccess(id){
  const months = Number($("term_" + id).value); let until = null;
  if (months) { const d = new Date(); d.setMonth(d.getMonth() + months); until = d.toISOString().slice(0,10); }
  const { data } = await sb.rpc(P + "_set_access", { p_user:id, p_until:until, p_unlimited:!months }); okToast(data);
}
async function closeAccess(id){ const { data } = await sb.rpc(P + "_set_access", { p_user:id, p_until:null, p_unlimited:false }); okToast(data); }
async function confirmMail(id){ if (!confirm(t("confirmAsk"))) return; const { data } = await sb.rpc(P + "_admin_confirm_email", { p_user:id }); okToast(data); }
async function setUz(id, on){ const { data } = await sb.rpc(P + "_set_uz", { p_user:id, p_on:on }); okToast(data); }
async function removeUser(id){
  const u = (window._users || {})[id];
  if (!confirm(t("delAsk") + (u ? "\n" + u.last_name + " " + u.first_name + " · " + (u.email||"") : ""))) return;
  const { data } = await sb.rpc(P + "_remove_member", { p_user:id }); okToast(data);
}
async function setRole(id, role){ const { data } = await sb.rpc(P + "_set_role", { p_user:id, p_role:role }); toast(data === "ok" ? t("saved") : t("error")); }

/* ========= Старт ========= */
applyLang();
sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") setTimeout(async () => {
  const np = prompt(t("newPw"));
  if (np && np.length >= 6) { await sb.auth.updateUser({ password:np }); toast(t("saved")); boot(); } }, 300); });
boot();
</script>
